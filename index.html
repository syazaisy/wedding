<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Syaza + Aisy | Wedding Day</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

        }


        body {

            background: #f7f1d9;

        }


        /* ==========================================
           PAGE 1 — COVER
        ========================================== */

        .cover-page {

            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #f7f1d9;

        }


        /* YOUR ORIGINAL IMAGE */

        .cover-image {

            position: absolute;

            width: 100%;
            height: 100%;

            left: 0;
            top: 0;

            object-fit: contain;

            object-position: center center;

            display: block;

        }


        /* ==========================================
           INVISIBLE OPEN INVITATION CLICK AREA
        ========================================== */

        .open-invitation-click {

            position: absolute;

            left: 50%;

            bottom: 5%;

            transform: translateX(-50%);

            width: 65%;

            height: 12%;

            background: transparent;

            border: none;

            cursor: pointer;

            z-index: 10;

        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .cover-image {

                object-fit: contain;

            }


            .open-invitation-click {

                width: 75%;

                height: 13%;

                bottom: 4%;

            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         PAGE 1
    ========================================== -->

    <section
        id="page1"
        class="cover-page">


        <!-- ORIGINAL COVER IMAGE -->

        <img
            src="page1-cover.png.png"
            alt="Syaza and Aisy Wedding Invitation"
            class="cover-image">


        <!--
            Invisible clickable area.

            The actual Open Invitation
            design is already inside the PNG.
        -->

        <button
            class="open-invitation-click"
            onclick="openInvitation()"
            aria-label="Open Invitation">
        </button>


    </section>



    <script>

        function openInvitation() {

            /*
             * Page 2 will be added later.
             *
             * For now, clicking the button
             * does nothing.
             */

        }

    </script>


</body>

</html>
