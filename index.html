<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Syaza + Aisy | Wedding Day</title>

    <!-- Handwriting font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #f8f4df;
        }

        /* =========================================
           PAGE 1
           ========================================= */

        .cover-page {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #f8f4df;
        }

        /*
        Your original artwork.

        IMPORTANT:
        The filename must match the file you uploaded
        to GitHub.
        */

        .cover-image {
            position: absolute;

            width: 100%;
            height: 100%;

            left: 0;
            top: 0;

            object-fit: contain;

            object-position: center center;

            display: block;
        }


        /* =========================================
           OPEN INVITATION BUTTON
           ========================================= */

     

        /* =========================================
           HEARTBEAT
           ========================================= */

        .heartbeat {

            animation: heartbeat 1.5s ease-in-out infinite;

            transform-origin: center;
        }

        @keyframes heartbeat {

            0% {
                transform: scale(1);
            }

            10% {
                transform: scale(1.08);
            }

            20% {
                transform: scale(1);
            }

            30% {
                transform: scale(1.08);
            }

            40% {
                transform: scale(1);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =========================================
           MOBILE
           ========================================= */

    /* =========================================
   INVISIBLE OPEN INVITATION CLICK AREA
   ========================================= */

.open-invitation-click {
    position: absolute;

    left: 50%;
    bottom: 4%;

    transform: translateX(-50%);

    width: 70%;
    height: 13%;

    background: transparent;

    cursor: pointer;

    z-index: 10;
}


@media (max-width: 600px) {

    .cover-image {
        object-fit: cover;
    }

}


/* =========================================
   PAGE 2
   ========================================= */

.page2 {
    position: relative;
    width: 100vw;
    min-height: 100vh;
    background: #f8f4df;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.page2-art {
    position: relative;

    width: min(100vw, 56.25vh);
    aspect-ratio: 9 / 16;

    overflow: hidden;
}

/* Main artwork */

.page2-base {
    position: absolute;

    width: 100%;
    height: 100%;

    left: 0;
    top: 0;

    display: block;
}

/* =========================================
   TITLE
   ========================================= */

.page2-title {
    position: absolute;

    left: 0;
    top: 2.2%;

    width: 100%;
    height: auto;

    opacity: 0;

    animation:
        page2Write 2s ease forwards;
}


/* =========================================
   PARAGRAPH
   ========================================= */

.page2-paragraph {
    position: absolute;

    left: 0;
    top: 12.5%;

    width: 100%;
    height: auto;

    opacity: 0;

    mix-blend-mode: multiply;

    animation:
        page2Write 3s ease forwards;

    animation-delay: 1.5s;
}


/* =========================================
   HEART ON NUMBER 5
   ========================================= */

.page2-heart5 {
    position: absolute;

    left: 69%;
    top: 59%;

    width: 13%;
    height: auto;

    mix-blend-mode: multiply;

    transform-origin: center;

    animation:
        page2Heartbeat 1.5s ease-in-out infinite;
}

/* =========================================
   BLINKING BULBS
   ========================================= */

.page2-heart5 {
    position: absolute;

    left: 69%;
    top: 59%;

    width: 13%;
    height: auto;

    transform-origin: center;

    animation:
        page2Heartbeat 1.5s ease-in-out infinite;
}


/* =========================================
   ANIMATIONS
   ========================================= */

@keyframes page2Write {

    0% {
        opacity: 1;
        clip-path: inset(0 100% 0 0);
    }

    100% {
        opacity: 1;
        clip-path: inset(0 0 0 0);
    }

}


@keyframes page2Heartbeat {

    0% {
        transform: scale(1);
    }

    10% {
        transform: scale(1.08);
    }

    20% {
        transform: scale(1);
    }

    30% {
        transform: scale(1.08);
    }

    40% {
        transform: scale(1);
    }

    100% {
        transform: scale(1);
    }

}


@keyframes page2Blink {
    0% {
        opacity: 0.65;
    }

    25% {
        opacity: 1;
    }

    45% {
        opacity: 0.55;
    }

    65% {
        opacity: 1;
    }

    100% {
        opacity: 0.65;
    }
}   
</style>
</head>


<body>

    <!-- =========================================
         PAGE 1 — COVER
         ========================================= -->

    <section
        id="page1"
        class="cover-page">

        <!-- YOUR EXACT COVER IMAGE -->

        <img
            src="page1-cover.png.png"
            alt="Syaza and Aisy Wedding Invitation"
            class="cover-image">


       <!-- INVISIBLE CLICK AREA OVER ORIGINAL BUTTON -->

<div
    class="open-invitation-click"
    onclick="openInvitation()">
</div>

    </section>
    <!-- =========================================
     PAGE 2
     ========================================= -->

<section id="page2" class="page2">

    <div class="page2-art">

        <!-- Main static artwork -->
        <img
            src="page2-base.png"
            class="page2-base"
            alt="Wedding Save the Date">

        <!-- Animated title -->
        <img
            src="page2-title.png"
            class="page2-title"
            alt="Tahukah anda?">

        <!-- Animated paragraph -->
        <img
            src="page2-paragraph.png"
            class="page2-paragraph"
            alt="Masa berlalu begitu pantas...">

        <!-- Heart around number 5 -->
        <img
            src="page2-heart5.png"
            class="page2-heart5"
            alt="5">

        <!-- Blinking lights -->
        <img
            src="page2-bulbs.png"
            class="page2-bulbs"
            alt="Christmas lights">

    </div>

</section>


    <script>

        function openInvitation() {


document.getElementById("page2").scrollIntoView({
    behavior: "smooth"
});

        }

    </script>

</body>

</html>
