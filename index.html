<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Syaza + Aisy | Wedding Day</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap");



/* =========================================
   GENERAL
========================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #f8f4df;
    color: #203d22;
    font-family: Georgia, serif;
}

img {
    display: block;
    max-width: 100%;
}


/* =========================================
   COVER
========================================= */

.cover-page {
    position: relative;
    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #f8f4df;

    overflow: hidden;
}

.cover-image {
    width: 100%;
    max-width: 600px;
    height: auto;
}


/* Invisible clickable area
   over the ORIGINAL green button
*/

.open-invitation-click {
    position: absolute;

    left: 50%;
    bottom: 6%;

    transform: translateX(-50%);

    width: 75%;
    height: 12%;

    background: transparent;
    border: none;

    cursor: pointer;

    z-index: 10;
}


/* =========================================
   MAIN INVITATION
========================================= */

.invitation-content {
    width: 100%;

    background: #f8f4df;

    padding-bottom: 80px;
}


/* =========================================
   MAIN ARTWORK
========================================= */

.main-artwork-wrapper {

    position: relative;

    width: 100%;
    max-width: 600px;

    margin: 0 auto;
}

.main-artwork {

    width: 100%;
    height: auto;
}
/* =========================================
   CLICKABLE LINKS INSIDE LOCATION HEART
   ========================================= */

.location-hotspot {
    position: absolute;
    z-index: 20;
    display: block;
    background: rgba(91, 147, 72, 0.75);
    cursor: pointer;
    border-radius: 6px;
}

/* TEMPORARY WAZE CLICK AREA */
.waze-hotspot {
    left: 62%;
    top: 46.5%;
    width: 27%;
    height: 2.2%;
}

.maps-hotspot {
    left: 61%;
    top: 50.5%;
    width: 31%;
    height: 2.2%;
}

/* =========================================
   RSVP
========================================= */

.rsvp-section {
    width: 100%;
    max-width: 820px;
    min-height: 2048px;
    margin: 0 auto 80px;
    padding: 0 0 80px;

    text-align: center;

    position: relative;

    background-image: url("rsvp-background-new.png");
    background-repeat: no-repeat;
    background-position: top center;
    background-size: 100% auto;

    box-sizing: border-box;
}


/* -----------------------------------------
   HIDE HTML DECORATION
   The decoration is already inside image
----------------------------------------- */

.rsvp-decoration {
    display: none;
}


/* -----------------------------------------
   HIDE HTML TITLE
   RSVP title is already inside image
----------------------------------------- */

.rsvp-title {
    display: none;
}


/* -----------------------------------------
   HIDE HTML SUBTITLE
   Subtitle is already inside image
----------------------------------------- */

.rsvp-subtitle {
    display: none;
}


/* -----------------------------------------
   FORM / FILL-IN AREA
   Transparent so the red background
   from the image remains visible
----------------------------------------- */

.rsvp-card {
    position: relative;

    width: 88%;

    margin: 0 auto;

    padding: 0;

    background: transparent;

    border: none;

    border-radius: 0;

    box-shadow: none;

    text-align: left;

    overflow: visible;

    box-sizing: border-box;

    /*
       Move the form down so it sits
       inside the red area of the image.
    */
    padding-top: 520px;
}


/* -----------------------------------------
   LABELS
----------------------------------------- */

.rsvp-label {
    display: block;

    margin-top: 25px;
    margin-bottom: 10px;

    color: #ffe2c9;

    font-family: "Caveat", cursive;

    font-size: 31px;

    font-weight: 500;

    line-height: 1.1;
}

.rsvp-card .rsvp-label:first-child {
    margin-top: 0;
}


/* -----------------------------------------
   NAME INPUT + PAX SELECT
----------------------------------------- */

.rsvp-input,
.rsvp-select {

    width: 100%;

    height: 62px;

    padding: 0 22px;

    border: 2px solid rgba(255,255,255,0.8);

    border-radius: 17px;

    background: #fffdf7;

    color: #183d22;

    font-family: "DM Sans", sans-serif;

    font-size: 17px;

    outline: none;

    box-sizing: border-box;
}


.rsvp-input::placeholder {
    color: #929292;
}


.rsvp-input:focus,
.rsvp-select:focus {

    border-color: #ffe3d0;

    box-shadow:
        0 0 0 3px rgba(255,226,201,0.25);
}


/* -----------------------------------------
   ATTENDANCE OPTIONS
----------------------------------------- */

.rsvp-options {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 18px;

    width: 100%;
}


.rsvp-option {

    position: relative;

    display: flex;

    align-items: center;

    gap: 15px;

    min-height: 72px;

    padding: 14px 22px;

    background: #fffdf7;

    border-radius: 17px;

    color: #183d22;

    font-family: "DM Sans", sans-serif;

    font-size: 17px;

    cursor: pointer;

    box-sizing: border-box;
}


.rsvp-option input {

    position: absolute;

    opacity: 0;

    pointer-events: none;
}


.radio-circle {

    flex-shrink: 0;

    width: 29px;
    height: 29px;

    border:
        3px solid #d5252d;

    border-radius: 50%;

    background: white;

    box-sizing: border-box;
}


.rsvp-option:nth-child(2)
.radio-circle {

    border-color: #155b43;
}


.rsvp-option input:checked
+ .radio-circle {

    background: #d5252d;

    box-shadow:
        inset 0 0 0 6px white;
}


.rsvp-option:nth-child(2)
input:checked
+ .radio-circle {

    background: #155b43;
}


/* -----------------------------------------
   DROPDOWN
----------------------------------------- */

.rsvp-select {

    cursor: pointer;

    appearance: auto;
}


/* -----------------------------------------
   HANTAR BUTTON
----------------------------------------- */

.rsvp-submit {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    width: 100%;

    height: 75px;

    margin-top: 38px;

    padding: 10px 90px 10px 20px;

    border:
        2px solid rgba(255,255,255,0.35);

    border-radius: 30px;

    background:
        linear-gradient(
            180deg,
            #176147 0%,
            #104f3a 100%
        );

    color: white;

    font-family: "Caveat", cursive;

    font-size: 43px;

    font-weight: 500;

    cursor: pointer;

    box-shadow:
        inset 0 2px 4px
        rgba(255,255,255,0.15),

        0 3px 0
        rgba(0,0,0,0.18);

    box-sizing: border-box;
}


.rsvp-submit::after {

    content: "➤";

    position: absolute;

    right: 25%;

    top: 50%;

    transform:
        translateY(-50%)
        rotate(-18deg);

    font-family: Arial, sans-serif;

    font-size: 40px;

    color: white;
}


.rsvp-submit:hover {

    transform:
        translateY(-2px);
}


/* -----------------------------------------
   SUCCESS MESSAGE
----------------------------------------- */

.rsvp-success {

    display: none;

    margin-top: 25px;

    padding: 20px;

    background: #fffdf7;

    border-radius: 15px;

    color: #183d22;

    text-align: center;

    font-family: "Caveat", cursive;

    font-size: 25px;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .rsvp-section {

    width: 100%;

    min-height: 0;

    margin-bottom: 0;

    background-size: 100% auto;

}


    .rsvp-card {

        width: 88%;

        padding-top: 255px;

    }


    .rsvp-label {

        font-size: 25px;

    }


    .rsvp-options {

        grid-template-columns: 1fr;

        gap: 12px;

    }


    .rsvp-option {

        min-height: 62px;

        font-size: 15px;

    }


    .rsvp-input,
    .rsvp-select {

        height: 56px;

        font-size: 15px;

    }


    .rsvp-submit {

        height: 65px;

        font-size: 36px;

        padding-right: 70px;

    }


    .rsvp-submit::after {

        right: 18%;

        font-size: 30px;

    }

}

/* ==========================================
   COUNTDOWN
========================================== */

.countdown-section {
    width: 100%;
    margin: 0;
    padding: 0;

    position: relative;

    background-color: #f8f4df;

    overflow: hidden;
}


.countdown-wrapper {
    width: 100%;
    aspect-ratio: 1536 / 2048;

    position: relative;

    background-image: url("countdown-bg-latest.png");
    background-repeat: no-repeat;
    background-position: top center;
    background-size: 100% auto;
}


/* ==========================================
   LIVE COUNTDOWN NUMBERS
========================================== */

.countdown-number {
    position: absolute;

    color: #183d22;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 8.2vw;

    font-weight: 500;

    line-height: 1;

    text-align: center;

    white-space: nowrap;

    z-index: 5;
}


/* DAYS */

.days-number {
    left: 4.5%;
    top: 77.0%;
    width: 20%;
}


/* HOURS */

.hours-number {
    left: 29.5%;
    top: 77.0%;
    width: 20%;
}


/* MINUTES */

.minutes-number {
    left: 54.5%;
    top: 77.0%;
    width: 20%;
}


/* SECONDS */

.seconds-number {
    left: 79.5%;
    top: 77.0%;
    width: 20%;
}

/* ==========================================
   MOBILE
========================================== */

@media (max-width: 600px) {

    .countdown-wrapper {
        width: 100%;
        aspect-ratio: 1536 / 2048;
        background-size: 100% auto;
    }


    .countdown-number {
        font-size: 8.2vw;
        font-weight: 500;
        line-height: 1;
    }


    .days-number {
        left: 4.5%;
        top: 77.0%;
        width: 20%;
    }


    .hours-number {
        left: 29.5%;
        top: 77.0%;
        width: 20%;
    }


    .minutes-number {
        left: 54.5%;
        top: 77.0%;
        width: 20%;
    }


    .seconds-number {
        left: 79.5%;
        top: 77.0%;
        width: 20%;
    }

}


/* =========================================
   MUSIC
========================================= */

.music-section {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 9999;
    margin: 0;
}

.music-button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid #183d22;
    background: #f8f4df;
    color: #183d22;
    font-family: Arial, sans-serif;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transition: transform 0.2s ease;
}

.music-button:hover {
    transform: scale(1.05);
}

.music-button:active {
    transform: scale(0.95);
}

/* =========================================
   GUESTBOOK
========================================= */

.guestbook-section {

    position: relative;

    width: 100%;

    max-width: 820px;

    margin: 0 auto 80px;

    /*
       The uploaded artwork is 896 × 1640.
       This keeps the original proportion.
    */
    aspect-ratio: 896 / 1640;

    background-image:
        url("guestbook-background-new.png");

    background-repeat: no-repeat;

    background-position:
        top center;

    background-size:
        100% 100%;

    box-sizing: border-box;

    /*
       Remove normal section spacing because
       the artwork itself controls the layout.
    */
    padding: 0;
}


/* -----------------------------------------
   TITLE
   Already included in the image
----------------------------------------- */

.guestbook-section h2,
.guestbook-section .section-title {

    display: none;
}


/* -----------------------------------------
   DESCRIPTION
   Already included in the image
----------------------------------------- */

.guestbook-section .form-description {

    display: none;
}


/* -----------------------------------------
   FORM
   This sits inside the cream box
----------------------------------------- */

.guestbook-form {

    position: absolute;

    /*
       Position of the cream box
       inside the artwork.
    */
    top: 34%;

    left: 7%;

    width: 86%;

    height: 53%;

    display: flex;

    flex-direction: column;

    gap: 18px;

    margin: 0;

    padding: 25px 20px;

    box-sizing: border-box;

    text-align: left;

}


/* -----------------------------------------
   NAME INPUT
----------------------------------------- */

.guestbook-form input[type="text"] {

    width: 100%;

    height: 58px;

    padding: 0 20px;

    box-sizing: border-box;

    border: none;

    border-radius: 14px;

    background: #fffdf2;

    color: #183d22;

    font-family:
        "DM Sans",
        sans-serif;

    font-size: 17px;

    outline: none;

    box-shadow:
        0 1px 4px
        rgba(0,0,0,0.08);
}


.guestbook-form input[type="text"]::placeholder {

    color: #777;

}


/* -----------------------------------------
   UCAPAN TEXTAREA
----------------------------------------- */

.guestbook-form textarea {

    flex: 1;

    width: 100%;

    min-height: 250px;

    padding: 18px 20px;

    box-sizing: border-box;

    resize: none;

    border: none;

    border-radius: 16px;

    background: #fffdf2;

    color: #183d22;

    font-family:
        "DM Sans",
        sans-serif;

    font-size: 17px;

    line-height: 1.5;

    outline: none;

    box-shadow:
        0 1px 4px
        rgba(0,0,0,0.08);
}


.guestbook-form textarea::placeholder {

    color: #777;

}


/* -----------------------------------------
   HANTAR UCAPAN BUTTON
----------------------------------------- */

.guestbook-form button {

    width: 100%;

    height: 65px;

    flex-shrink: 0;

    border: none;

    border-radius: 18px;

    background:
        #155b43;

    color: white;

    font-family:
        "Caveat",
        cursive;

    font-size: 34px;

    font-weight: 500;

    cursor: pointer;

    box-shadow:
        0 3px 0
        rgba(0,0,0,0.15);

    transition:
        transform 0.2s ease;
}


.guestbook-form button:hover {

    transform:
        translateY(-2px);
}


.guestbook-form button:active {

    transform:
        translateY(1px);
}


/* -----------------------------------------
   LOADING / SUBMITTED MESSAGES
----------------------------------------- */

#guestbookMessages {

    position: absolute;

    /*
       Keep messages below the form
       and outside the main artwork.
    */
    top: 76%;

    left: 7%;

    width: 86%;

    text-align: center;

    color: #183d22;

    font-family:
        "DM Sans",
        sans-serif;

}


/* Individual guest message */

.guest-message {

    margin-bottom: 15px;

    padding: 15px;

    background: #fffdf2;

    border-radius: 12px;

}


.guest-name {

    margin-bottom: 5px;

    font-weight: 600;

    color: #183d22;
}


.guest-text {

    color: #333;

    line-height: 1.5;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .guestbook-section {

        width: 100%;

        max-width: none;

        margin-bottom: 50px;

        aspect-ratio: 896 / 1640;

    }


    .guestbook-form {

        top: 34%;

        left: 7%;

        width: 86%;

        height: 49%;

        padding:
            15px 12px;

        gap: 12px;

    }


    .guestbook-form input[type="text"] {

        height: 48px;

        padding:
            0 15px;

        font-size: 14px;

        border-radius: 12px;

    }


    .guestbook-form textarea {

        min-height: 180px;

        padding:
            14px 15px;

        font-size: 14px;

        border-radius: 12px;

    }


    .guestbook-form button {

        height: 52px;

        font-size: 28px;

        border-radius: 14px;

    }


   #guestbookMessages {
    top: 84%;
    left: 7%;
    width: 86%;
    text-align: center;
    font-size: 14px;
    color: #183d22;
    z-index: 5;
}
}


/* =========================================
   FOOTER
========================================= */

.footer {

    text-align: center;

    padding: 40px 20px;

    color: #183d22;

    font-size: 14px;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .cover-image {

        width: 100%;

        max-width: none;
    }

    .open-invitation-click {

        width: 80%;

        height: 13%;

        bottom: 5%;
    }

    .section-title {

        font-size: 34px;
    }

    .count-number {

        font-size: 24px;
    }

    .location-buttons {

        flex-direction: column;

        margin-top: -10px;
    }

}
</style>

</head>

<body>



<!-- =========================================
     COVER
========================================= -->

<section class="cover-page"
         id="cover">

    <img
        src="page1-cover.png.png"
        alt="Syaza + Aisy Wedding Day"
        class="cover-image">

    <!--
        Invisible button placed over
        the ORIGINAL Open Invitation
        button inside the artwork.
    -->

    <button
        class="open-invitation-click"
        onclick="openInvitation()"
        aria-label="Open Invitation">
    </button>

</section>



<!-- =========================================
     MAIN INVITATION
========================================= -->

<main
    class="invitation-content"
    id="invitation">


    <!-- =====================================
         YOUR MAIN WEDDING ARTWORK
    ====================================== -->

    <div class="main-artwork-wrapper">

    <img
        src="content-true.png"
        alt="Wedding invitation"
        class="main-artwork">

    <!-- INVISIBLE WAZE CLICK AREA -->
    <a
        href="https://waze.com/ul/hw234w0bkw"
        target="_blank"
        rel="noopener"
        class="location-hotspot waze-hotspot"
        aria-label="Open Waze">
    </a>

    <!-- INVISIBLE GOOGLE MAPS CLICK AREA -->
    <a
        href="https://www.google.com/maps/dir//Rumah+Abang+Jamil+BATU+PAHAT,+Lot+2199,+Jalan+Peserai+Lama,+Taman+Muhibbah,+83000+Batu+Pahat,+Johor/@3.103049,101.627155,14z/data=!4m8!4m7!1m0!1m5!1m1!1s0x31d057693ec826af:0xce495a0b5b097aaa!2m2!1d102.9204243!2d1.8501724?entry=ttu&g_ep=EgoyMDI2MTAwNy4wIKXMDSoASAFQAw%3D%3D"
        target="_blank"
        rel="noopener"
        class="location-hotspot maps-hotspot"
        aria-label="Open Google Maps">
    </a>

</div>
<!-- =====================================
         MUSIC
    ====================================== -->

    <section class="music-section">

        <button
            class="music-button"
            onclick="toggleMusic()"
            id="musicButton"
            aria-label="Play or pause music">
            ▶
        </button>

        <audio
            id="weddingMusic"
            loop>
            <source
                src="music.mp3"
                type="audio/mpeg">
        </audio>

    </section>
<!-- =====================================
     RSVP
====================================== -->

<section class="rsvp-section" id="rsvp">

    <div class="rsvp-decoration">
        ♡
    </div>

    <h2 class="rsvp-title">
        RSVP
    </h2>

    <p class="rsvp-subtitle">
        Sila maklumkan kehadiran anda<br>
        sebelum tarikh yang ditetapkan.
    </p>

    <form class="rsvp-card" id="rsvpForm">

        <label class="rsvp-label" for="rsvp-name">
            Nama *
        </label>

        <input
            type="text"
            id="rsvp-name"
            name="name"
            class="rsvp-input"
            placeholder="Masukkan nama anda"
            required>

        <label class="rsvp-label">
            Adakah anda akan hadir? *
        </label>

        <div class="rsvp-options">

            <label class="rsvp-option">
                <input
                    type="radio"
                    name="attendance"
                    value="Ya, akan hadir"
                    required>
                <span class="radio-circle"></span>
                <span>Ya, akan hadir</span>
            </label>

            <label class="rsvp-option">
                <input
                    type="radio"
                    name="attendance"
                    value="Tidak, tidak dapat hadir">
                <span class="radio-circle"></span>
                <span>Tidak, tidak dapat hadir</span>
            </label>

        </div>

        <label
            class="rsvp-label"
            for="rsvp-pax">
            Bilangan tetamu *
        </label>

        <select
            id="rsvp-pax"
            name="pax"
            class="rsvp-select"
            required>

            <option value="">
                Pilih bilangan tetamu
            </option>

            <option value="1">1 orang</option>
            <option value="2">2 orang</option>
            <option value="3">3 orang</option>
            <option value="4">4 orang</option>
            <option value="5">5 orang</option>
            <option value="6">6 orang</option>
            <option value="7">7 orang</option>
            <option value="8">8 orang</option>
            <option value="9">9 orang</option>
            <option value="10">10 orang</option>

        </select>

        <button
            type="submit"
            class="rsvp-submit">
            Hantar
        </button>

        <div
            class="rsvp-success"
            id="rsvpSuccess">
            Terima kasih! Kehadiran anda telah direkodkan. ❤️
        </div>

    </form>

</section>



<!-- =====================================
     GUESTBOOK
====================================== -->

<section
    class="guestbook-section"
    id="guestbook">

    <form
        class="guestbook-form"
        id="guestbookForm">

        <!-- NAMA -->

        <input
            type="text"
            name="name"
            id="guest-name"
            placeholder="Nama anda"
            required>


        <!-- UCAPAN -->

        <textarea
            name="message"
            id="guest-message"
            placeholder="Tulis ucapan anda di sini ❤️"
            required></textarea>


        <!-- HANTAR -->

        <button
            type="submit">

            Hantar Ucapan

        </button>

    </form>


    <!-- Guestbook messages -->

    <div
        id="guestbookMessages">

        Loading ucapan...

    </div>

</section>

    <!-- ==========================================
     COUNTDOWN
========================================== -->

<section class="countdown-section" id="countdown">

    <div class="countdown-wrapper">

        <div class="countdown-number days-number" id="days">
            00
        </div>

        <div class="countdown-number hours-number" id="hours">
            00
        </div>

        <div class="countdown-number minutes-number" id="minutes">
            00
        </div>

        <div class="countdown-number seconds-number" id="seconds">
            00
        </div>

    </div>

</section>

    



    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="footer">

        <p>
            With love, Syaza & Aisy ❤️
        </p>

    </footer>


</main>

<script>

/* =========================================
   OPEN INVITATION + MUSIC
========================================= */

function openInvitation() {

    document
        .getElementById("invitation")
        .scrollIntoView({
            behavior: "smooth"
        });

    const music =
        document.getElementById("weddingMusic");

    const musicButton =
        document.getElementById("musicButton");

    music.play()
        .then(function() {
            musicButton.innerText = "Ⅱ";
        })
        .catch(function(error) {
            console.log("Music could not autoplay:", error);
        });
}


/* =========================================
   COUNTDOWN
========================================= */

const weddingDate =
    new Date("December 5, 2026 19:30:00").getTime();

function updateCountdown() {

    const now =
        new Date().getTime();

    const difference =
        weddingDate - now;

    if (difference <= 0) {

        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";

        return;
    }

    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );

    const hours =
        Math.floor(
            (difference %
            (1000 * 60 * 60 * 24))
            /
            (1000 * 60 * 60)
        );

    const minutes =
        Math.floor(
            (difference %
            (1000 * 60 * 60))
            /
            (1000 * 60)
        );

    const seconds =
        Math.floor(
            (difference %
            (1000 * 60))
            /
            1000
        );

    document.getElementById("days").innerText =
        String(days).padStart(2, "0");

    document.getElementById("hours").innerText =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").innerText =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").innerText =
        String(seconds).padStart(2, "0");
}

setInterval(updateCountdown, 1000);
updateCountdown();


/* =========================================
   MUSIC
========================================= */

const music =
    document.getElementById("weddingMusic");

const musicButton =
    document.getElementById("musicButton");

function toggleMusic() {

    if (music.paused) {

        music.play()
            .then(function() {
                musicButton.innerText = "Ⅱ";
            })
            .catch(function(error) {
                console.log("Music could not play:", error);
            });

    } else {

        music.pause();
        musicButton.innerText = "▶";

    }
}


/* =========================================
   GOOGLE APPS SCRIPT
========================================= */

const SCRIPT_URL =
    "PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";


/* =========================================
   RSVP SUBMISSION
========================================= */

document
    .getElementById("rsvpForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const form = event.target;
            const data = new FormData(form);

            data.append("type", "rsvp");

            try {

                await fetch(
                    SCRIPT_URL,
                    {
                        method: "POST",
                        body: data,
                        mode: "no-cors"
                    }
                );

                form.style.display = "none";

                document
                    .getElementById("rsvpSuccess")
                    .style.display = "block";

            } catch (error) {

                alert(
                    "Something went wrong. Please try again."
                );

            }
        }
    );


/* =========================================
   GUESTBOOK SUBMISSION
========================================= */

document
    .getElementById("guestbookForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const form = event.target;
            const data = new FormData(form);

            data.append("type", "guestbook");

            try {

                await fetch(
                    SCRIPT_URL,
                    {
                        method: "POST",
                        body: data,
                        mode: "no-cors"
                    }
                );

                form.reset();

                alert(
                    "💕 Terima kasih untuk ucapan anda!"
                );

                loadGuestbook();

            } catch (error) {

                alert(
                    "Something went wrong. Please try again."
                );

            }
        }
    );


/* =========================================
   LOAD GUESTBOOK
========================================= */

function loadGuestbook() {

    const callbackName =
        "guestbookCallback";

    window[callbackName] =
        function(data) {

            const container =
                document.getElementById(
                    "guestbookMessages"
                );

            container.innerHTML = "";

            if (
                !data ||
                data.length === 0
            ) {

                container.innerHTML =
                    "<p>Jadilah yang pertama meninggalkan ucapan ❤️</p>";

                return;
            }

            data.forEach(
                function(item) {

                    const message =
                        document.createElement("div");

                    message.className =
                        "guest-message";

                    message.innerHTML =
                        "<div class='guest-name'>" +
                        escapeHTML(item.name) +
                        "</div>" +
                        "<div class='guest-text'>" +
                        escapeHTML(item.message) +
                        "</div>";

                    container.appendChild(message);

                }
            );
        };

    const script =
        document.createElement("script");

    script.src =
        SCRIPT_URL +
        "?action=getGuestbook&callback=" +
        callbackName;

    document.body.appendChild(script);
}


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.innerText = text;

    return div.innerHTML;
}

</script>
