<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Syaza + Aisy | Wedding Day</title>

    <!-- Handwriting font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #f8f4df;
        }

        /* =========================================
           PAGE 1
           ========================================= */

        .cover-page {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #f8f4df;
        }

        /*
        Your original artwork.

        IMPORTANT:
        The filename must match the file you uploaded
        to GitHub.
        */

        .cover-image {
            position: absolute;

            width: 100%;
            height: 100%;

            left: 0;
            top: 0;

            object-fit: contain;

            object-position: center center;

            display: block;
        }


        /* =========================================
           OPEN INVITATION BUTTON
           ========================================= */

        .open-invitation {

            position: absolute;

            left: 50%;
            bottom: 6.5%;

            transform: translateX(-50%);

            width: 58%;
            max-width: 620px;

            padding: 18px 35px 22px;

            border: none;

            background: #3f5b25;

            color: white;

            font-family: "Caveat", cursive;

            font-size: clamp(28px, 4vw, 52px);

            font-weight: 400;

            line-height: 1;

            border-radius: 50%;

            cursor: pointer;

            z-index: 10;

            transition:
                transform 0.2s ease,
                filter 0.2s ease;
        }

        .open-invitation:hover {

            filter: brightness(1.08);

        }

        .open-invitation:active {

            transform:
                translateX(-50%)
                scale(0.96);

        }


        /* =========================================
           HEARTBEAT
           ========================================= */

        .heartbeat {

            animation: heartbeat 1.5s ease-in-out infinite;

            transform-origin: center;
        }

        @keyframes heartbeat {

            0% {
                transform: scale(1);
            }

            10% {
                transform: scale(1.08);
            }

            20% {
                transform: scale(1);
            }

            30% {
                transform: scale(1.08);
            }

            40% {
                transform: scale(1);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 600px) {

            .cover-image {

                object-fit: cover;

            }

            .open-invitation {

                width: 72%;

                bottom: 5%;

                font-size: 34px;

                padding: 15px 25px 18px;

            }
        }

    </style>
</head>


<body>

    <!-- =========================================
         PAGE 1 — COVER
         ========================================= -->

    <section
        id="page1"
        class="cover-page">

        <!-- YOUR EXACT COVER IMAGE -->

        <img
            src="page1-cover.png.png"
            alt="Syaza and Aisy Wedding Invitation"
            class="cover-image">


        <!-- OPEN INVITATION -->

        <button
            class="open-invitation"
            onclick="openInvitation()">

            Open Invitation

        </button>

    </section>


    <script>

        function openInvitation() {

            /*
             * Page 2 will be added later.
             *
             * For now this simply prepares
             * the button function.
             */

            alert("Page 2 coming next ❤️");

        }

    </script>

</body>

</html>
