<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Syaza + Aisy | Wedding Day</title>

    <!-- Handwriting font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #f8f4df;
        }

        /* =========================================
           PAGE 1
           ========================================= */

        .cover-page {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #f8f4df;
        }

        /*
        Your original artwork.

        IMPORTANT:
        The filename must match the file you uploaded
        to GitHub.
        */

        .cover-image {
            position: absolute;

            width: 100%;
            height: 100%;

            left: 0;
            top: 0;

            object-fit: contain;

            object-position: center center;

            display: block;
        }


        /* =========================================
           OPEN INVITATION BUTTON
           ========================================= */

     

        /* =========================================
           HEARTBEAT
           ========================================= */

        .heartbeat {

            animation: heartbeat 1.5s ease-in-out infinite;

            transform-origin: center;
        }

        @keyframes heartbeat {

            0% {
                transform: scale(1);
            }

            10% {
                transform: scale(1.08);
            }

            20% {
                transform: scale(1);
            }

            30% {
                transform: scale(1.08);
            }

            40% {
                transform: scale(1);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =========================================
           MOBILE
           ========================================= */

       /* =========================================
   INVISIBLE OPEN INVITATION CLICK AREA
   ========================================= */

.open-invitation-click {
    position: absolute;

    left: 50%;
    bottom: 4%;

    transform: translateX(-50%);

    width: 70%;
    height: 13%;

    background: transparent;

    cursor: pointer;

    z-index: 10;
}


@media (max-width: 600px) {

    .cover-image {
        object-fit: cover;
    }

}



    </style>
</head>


<body>

    <!-- =========================================
         PAGE 1 — COVER
         ========================================= -->

    <section
        id="page1"
        class="cover-page">

        <!-- YOUR EXACT COVER IMAGE -->

        <img
            src="page1-cover.png.png"
            alt="Syaza and Aisy Wedding Invitation"
            class="cover-image">


       <!-- INVISIBLE CLICK AREA OVER ORIGINAL BUTTON -->

<div
    class="open-invitation-click"
    onclick="openInvitation()">
</div>

    </section>


    <script>

        function openInvitation() {

            /*
             * Page 2 will be added later.
             *
             * For now this simply prepares
             * the button function.
             */

            alert("Page 2 coming next ❤️");

        }

    </script>

</body>

</html>
